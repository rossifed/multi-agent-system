[project]
name = "agent-platform"
version = "0.1.0"
description = "Multi-agent system platform - Phase 0 foundation (Claude Code session gateway)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "pexpect>=4.9,<5.0",
    "pyte>=0.8,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-cov>=5.0,<6.0",
    "anyio>=4.4,<5.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.5,<1.0",
    "pyright>=1.1.370",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_platform"]

[tool.ruff]
line-length = 119
target-version = "py311"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=agent_platform --cov-report=term-missing --cov-fail-under=80"
pythonpath = ["src"]

[tool.coverage.run]
source = ["agent_platform"]
branch = true
# Interactive (PTY) backend drives a real `claude` TUI — validated via integration/
# manual runs, not unit tests (no PTY/CLI in CI).
omit = ["*/core/interactive_backend.py"]
